# F-Droid build recipe for EU Stats Multiplatform.
#
# This file is the source of truth for the merge request submitted to
# https://gitlab.com/fdroid/fdroiddata once the upstream tag is cut.
# F-Droid will copy it into `metadata/eu.eurostat.app.yml` in that repo
# and build the APK on its own infrastructure.
#
# Spec reference: https://f-droid.org/docs/Build_Metadata_Reference/

