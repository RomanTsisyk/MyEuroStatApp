AuthorName: Roman Tsisyk
AuthorEmail: ROMAN.TSISYK1@gmail.com
WebSite: https://romantsisyk.github.io/MyEuroStatApp/
SourceCode: https://github.com/RomanTsisyk/MyEuroStatApp
IssueTracker: https://github.com/RomanTsisyk/MyEuroStatApp/issues
Changelog: https://github.com/RomanTsisyk/MyEuroStatApp/blob/master/CHANGELOG.md

Summary: Official European statistics on every device
Description: |
    EU Stats Multiplatform is an independent third-party open-source client
    for the public Eurostat dissemination API. It turns the dense JSON-stat
    2.0 responses Eurostat publishes into calm, readable charts across eight
    thematic modules: economy, population, environment, trade, transport,
    tourism, social and science.

    No accounts, no analytics, no tracking, no advertising. The app caches
    every response locally with stale-while-revalidate semantics, so the
    last view stays available without a network connection.

    The app is not affiliated with, endorsed by or sponsored by Eurostat or
    the European Commission. The Eurostat name is used solely to reference
    the public data source. The underlying datasets are republished as
    Eurostat publishes them under Creative Commons Attribution 4.0.

RepoType: git
Repo: https://github.com/RomanTsisyk/MyEuroStatApp.git

