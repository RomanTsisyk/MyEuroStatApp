name: Build

# Actions are pinned to full commit SHAs (not tags) for supply-chain
# integrity; Dependabot's github-actions ecosystem (.github/dependabot.yml)
# keeps them current via weekly PRs.

on:
  push:
    branches: [main, master, 'develop-v*']
    # Docs-only changes skip the ~24-min macOS ios-test; master has no
    # required status checks, so docs-only PRs are not blocked.
    paths-ignore: ['docs/**', '**/*.md', 'fastlane/**', 'NLNET_SUBMISSION/**', 'design/**', 'metadata/**']
  pull_request:
    branches: [main, master]
    # Docs-only changes skip the ~24-min macOS ios-test; master has no
    # required status checks, so docs-only PRs are not blocked.
    paths-ignore: ['docs/**', '**/*.md', 'fastlane/**', 'NLNET_SUBMISSION/**', 'design/**', 'metadata/**']

# Superseded PR / develop-v* runs are cancelled; every master commit still
# gets a full build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # MIT-licensed cache backed by actions/cache; avoids opting into the
          # closed-source "Enhanced Caching" default and its Terms of Use.
          cache-provider: basic

      - name: Assemble Debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Run common tests
        run: ./gradlew allTests

      - name: Assemble Release APK
        # Exercises the real proguard/R8 minification pass. Falls back to the
        # debug keystore when keystore.properties is absent, so this works in
        # CI without release signing secrets.
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composeApp-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    # Desktop packaging smoke test: catches packaging regressions on the
    # JVM/desktop target. Kept as its own ubuntu job (independent of
    # `android`) so failures are attributable and it doesn't add to the
    # critical-path time of the APK build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # MIT-licensed cache backed by actions/cache; avoids opting into the
          # closed-source "Enhanced Caching" default and its Terms of Use.
          cache-provider: basic

      - name: Package desktop uber jar
        run: ./gradlew :composeApp:packageUberJarForCurrentOS

  ios-test:
    # Runs the real iosSimulatorArm64Test suite (not just a compile) across
    # all modules. A `\p{L}` regex once passed JVM tests AND iOS compile but
    # crashed at runtime on Kotlin/Native — see CLAUDE.md — so compile-only
    # is not a sufficient gate. GitHub's macos-latest runners ship with
    # Xcode + simulators preinstalled, so no DEVELOPER_DIR override is
    # needed here (that's only required on the maintainer's local Mac).
    # macOS runners bill ~10x an ubuntu runner, so this stays gated behind
    # the fast `android` job.
    needs: android
    runs-on: macos-latest
    # First cold run compiles+links Native test binaries for ~20 modules and
    # downloads the Kotlin/Native toolchain — it blew through a 45-minute
    # budget. The ~/.konan cache below makes warm runs much faster; the
    # timeout covers the cold case.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          # Falls back to the most recent toolchain cache for this OS when the
          # version catalog changes, instead of a ~20-min cold download.
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # MIT-licensed cache backed by actions/cache; avoids opting into the
          # closed-source "Enhanced Caching" default and its Terms of Use.
          cache-provider: basic

      - name: Run iOS simulator tests (arm64)
        run: ./gradlew iosSimulatorArm64Test
