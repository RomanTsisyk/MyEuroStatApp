name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble Debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Run common tests
        run: ./gradlew allTests

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-compile:
    # Compile-only gate for the iOS target: verifies the iosSimulatorArm64 klib
    # compiles across all modules without spending macOS minutes on signing,
    # packaging, or booting a simulator. macOS runners bill ~10x an ubuntu
    # runner, so this stays gated behind the fast `android` job and does the
    # minimum work needed to catch iOS-only compilation breakage.
    needs: android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile iOS (simulator arm64)
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64
