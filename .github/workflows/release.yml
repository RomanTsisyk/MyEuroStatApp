name: Release

# Actions are pinned to full commit SHAs (not tags) for supply-chain
# integrity; Dependabot's github-actions ecosystem (.github/dependabot.yml)
# keeps them current via weekly PRs.

# Two ways to run this workflow:
#
#  * Push a tag like v0.7.0  -> builds the release APK and the three native
#    desktop installers, then a final `publish` job creates ONE draft GitHub
#    Release for the tag with everything attached. It stays a draft until the
#    maintainer reviews and publishes it (a tag containing "-", e.g.
#    v0.7.0-rc1, is marked as a pre-release).
#
#  * Run it by hand (Actions -> Release -> Run workflow, or
#    `gh workflow run release.yml --ref <branch>`)  -> the same builds, but the
#    artifacts are only uploaded to the workflow run; nothing is published.
#    Use this to check that the Msi and Deb installers still build before
#    cutting a real tag.
#
# Android signing: when the four KEYSTORE_*/KEY_* secrets are configured the
# APK is signed with the real release key; otherwise the build falls back to
# the debug keystore (same behavior as local builds without
# keystore.properties) so the pipeline stays green on forks. v0.7.0 is
# deliberately released debug-signed (no KEYSTORE_* secrets configured yet)
# — see docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Never cancel a release build (e.g. a second tag push mid-run) — let it
# finish so a half-built draft release is never left behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default to read-only; only the `publish` job creates the release and needs
# `contents: write`.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # `secrets` is not a valid context in a step-level `if:` — GitHub
      # rejects the whole workflow file at parse time ("Unrecognized
      # named-value: secrets", startup failure with zero jobs). Job-level
      # `env` IS allowed to read secrets, so bridge through it.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # MIT-licensed cache backed by actions/cache; avoids opting into the
          # closed-source "Enhanced Caching" default and its Terms of Use.
          cache-provider: basic

      - name: Restore release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble Release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  desktop:
    # One native installer per OS; unsigned for now (Gatekeeper/SmartScreen
    # warnings are expected — signing certs are a post-grant item, see
    # docs/RELEASING.md).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            artifact: composeApp/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageMsi
            artifact: composeApp/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            task: packageDeb
            artifact: composeApp/build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # MIT-licensed cache backed by actions/cache; avoids opting into the
          # closed-source "Enhanced Caching" default and its Terms of Use.
          cache-provider: basic

      # jpackage builds the .deb with fakeroot and fails without it
      # (reproduced locally; not guaranteed to be on the runner image).
      - name: Install fakeroot
        if: ${{ matrix.task == 'packageDeb' }}
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Package installer
        run: ./gradlew :composeApp:${{ matrix.task }}

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    # Runs only for a real tag. Creating the release in one place (instead of
    # from every build job) avoids the race where four jobs try to create the
    # same release at once, and lets the draft be reviewed before it goes out.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [android, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job creates the GitHub Release, so only it needs write access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          # The section between "## [X.Y.Z]" and the next "## [" heading.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No [$VERSION] section in CHANGELOG.md — see the changelog for details." > RELEASE_NOTES.md
          fi
          {
            echo
            echo "---"
            echo "SHA-256 of the attached files:"
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create the draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: dist/*
