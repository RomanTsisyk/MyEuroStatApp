<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EU Stats Multiplatform — Live Demo</title>
  <meta name="description" content="Interactive slide-deck walkthrough of the EU Stats Multiplatform app — eight feature modules demonstrated frame by frame." />
  <meta name="theme-color" content="#2F4969" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0E0D0C" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://romantsisyk.github.io/MyEuroStatApp/presentation/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
  <style>
    :root {
      --paper: #F4F1EA;
      --paper-alt: #FFFFFF;
      --surface-2: #EAE6DD;
      --ink: #1A1817;
      --ink-subtle: #3A352E;
      --muted: #6B6359;
      --muted-alt: #B3ACA1;
      --accent: #2F4969;
      --border: rgba(0,0,0,0.07);
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
      --r-card: 16px;
      --r-pill: 999px;
      --mod-accent: var(--accent);
    }
    html[data-theme="dark"] {
      --paper: #0E0D0C;
      --paper-alt: #1A1816;
      --surface-2: #252320;
      --ink: #F5F2EB;
      --ink-subtle: #E8E2D5;
      --muted: #9C948A;
      --muted-alt: #5C544D;
      --accent: #7DA0C9;
      --border: rgba(255,255,255,0.1);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-feature-settings: 'ss01', 'cv01', 'cv11';
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .num { font-variant-numeric: tabular-nums; }
    button, select { font-family: inherit; }

    /* TOP BAR — minimal, sticky */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 56px; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px;
      background: color-mix(in srgb, var(--paper) 80%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-weight: 700; font-size: 14px; color: var(--ink);
      text-decoration: none; letter-spacing: -0.01em;
    }
    .brand a { color: inherit; text-decoration: none; }
    .brand .sub { color: var(--muted); font-weight: 400; margin-left: 4px; }
    .crumbs { color: var(--muted); font-size: 13px; flex: 1; }
    .crumbs a { color: var(--ink); text-decoration: none; border-bottom: 1px solid transparent; }
    .crumbs a:hover { border-bottom-color: var(--accent); }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      width: 36px; height: 36px;
      display: inline-grid; place-items: center;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      color: var(--ink-subtle);
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    html[data-theme="light"] .icon-moon { display: block; }
    html[data-theme="light"] .icon-sun { display: none; }
    html[data-theme="dark"] .icon-moon { display: none; }
    html[data-theme="dark"] .icon-sun { display: block; }
    .counter {
      font-size: 12px; font-weight: 500; color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-width: 70px; text-align: right;
    }
    .progress {
      position: fixed; top: 56px; left: 0; right: 0;
      height: 2px; background: transparent; z-index: 9;
    }
    .progress-fill {
      height: 100%;
      background: var(--mod-accent);
      transition: width .35s cubic-bezier(.4,0,.2,1), background-color .35s ease;
    }

    /* STAGE — two-pane layout */
    .stage {
      position: fixed; top: 58px; left: 0; right: 0; bottom: 60px;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.2fr);
      gap: 24px;
      padding: 24px 40px;
      align-items: center;
    }
    @media (max-width: 900px) {
      .stage { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
    }

    /* PHONE FRAME */
    .phone-wrap {
      display: flex; align-items: center; justify-content: center;
      height: 100%;
      min-height: 0;
    }
    .phone {
      position: relative;
      aspect-ratio: 9 / 19.5;
      max-height: 100%;
      max-width: 100%;
      width: auto;
      background: var(--paper-alt);
      border-radius: 36px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
    }
    .phone::after {
      /* subtle notch indicator at the top */
      content: '';
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 64px; height: 4px;
      background: rgba(0,0,0,.15);
      border-radius: 2px;
      z-index: 2;
    }
    html[data-theme="dark"] .phone::after { background: rgba(255,255,255,.2); }
    .phone img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .phone.fade-out img { opacity: 0; transition: opacity .15s ease; }
    .phone.fade-in img { opacity: 1; transition: opacity .35s ease; }

    /* DESCRIPTION PANEL */
    .panel {
      max-width: 540px;
      padding: 0 16px;
      animation: slide-in .45s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--mod-accent);
      margin-bottom: 12px;
    }
    .eyebrow .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--mod-accent);
    }
    .headline {
      font-size: clamp(40px, 5vw, 64px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
      margin: 0 0 6px;
      color: var(--ink);
    }
    .headline .unit { color: var(--muted); font-weight: 400; font-size: 0.45em; margin-left: 4px; }
    .subhead {
      font-size: 15px; color: var(--muted);
      margin: 0 0 24px;
      font-variant-numeric: tabular-nums;
    }
    h1.title {
      font-size: clamp(22px, 2.4vw, 30px);
      font-weight: 600; letter-spacing: -0.015em;
      margin: 0 0 12px;
      line-height: 1.2;
      color: var(--ink);
    }
    .description {
      font-size: 15px; line-height: 1.6;
      color: var(--ink-subtle);
      margin: 0 0 20px;
    }
    .action {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 14px;
      background: var(--surface-2);
      border-radius: 10px;
      border-left: 3px solid var(--mod-accent);
      font-size: 13.5px; color: var(--ink-subtle);
      margin: 0 0 20px;
    }
    .action::before {
      content: '▸'; color: var(--mod-accent); font-size: 14px; margin-top: 1px;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 6px;
      font-size: 12px;
    }
    .meta-pill {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      color: var(--muted);
      font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      font-size: 11.5px;
      letter-spacing: 0.01em;
    }
    .meta-pill.accent {
      color: var(--mod-accent);
      border-color: color-mix(in srgb, var(--mod-accent) 35%, transparent);
    }

    /* BOTTOM NAV */
    .botbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 60px; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      background: color-mix(in srgb, var(--paper) 80%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      gap: 16px;
    }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 0 16px; height: 38px;
      background: var(--paper-alt);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      color: var(--ink); font-weight: 500; font-size: 13px;
      cursor: pointer;
      transition: background-color .15s ease, transform .1s ease;
    }
    .nav-btn:hover { background: var(--surface-2); }
    .nav-btn:active { transform: scale(0.97); }
    .nav-btn:disabled { opacity: 0.4; cursor: default; }
    .nav-btn svg { width: 14px; height: 14px; }
    .hint {
      color: var(--muted); font-size: 11.5px;
      display: flex; gap: 12px;
    }
    .hint kbd {
      display: inline-block;
      padding: 1px 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: ui-monospace, 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--ink-subtle);
    }
    @media (max-width: 900px) {
      .hint { display: none; }
    }

    /* MODULE DOTS — module-level navigation under topbar */
    .modules {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 70px; z-index: 8;
      display: flex; gap: 6px;
      padding: 6px 12px;
      background: color-mix(in srgb, var(--paper-alt) 90%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      backdrop-filter: blur(12px);
    }
    .mod-dot {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      background: transparent;
      cursor: pointer;
      display: grid; place-items: center;
      font-size: 9px; font-weight: 700;
      color: var(--muted);
      transition: all .15s ease;
    }
    .mod-dot.current { border-color: var(--mod-accent); color: var(--ink); }
    .mod-dot:hover { color: var(--ink); }
    @media (max-width: 640px) {
      .modules { display: none; }
    }

    /* AUTO-PLAY indicator */
    .autoplay-track {
      position: fixed; top: 56px; left: 0;
      height: 2px;
      background: var(--mod-accent);
      transition: width .1s linear;
      z-index: 11;
      opacity: 0;
    }
    .autoplay-track.on { opacity: 1; }

    /* PRINT — hide nav for screen-capture */
    @media print {
      .topbar, .botbar, .modules, .progress { display: none; }
      .stage { top: 0; bottom: 0; }
    }

    /* REDUCED MOTION */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

          <polygon points="6 4 20 12 6 20 6 4"/>
        </svg>

  <div class="progress"><div class="progress-fill" id="progress"></div></div>

  <main class="stage" id="stage">

      <div class="subhead" id="subhead">—</div>
      <h1 class="title" id="title">—</h1>
      <p class="description" id="description">—</p>
      <div class="action" id="action">—</div>
      <div class="meta" id="meta"></div>

  <nav class="botbar">

    /* ------------- STATE ------------- */
    let idx = 0;
    let auto = false;
    let autoTimer = null;
    let autoStart = 0;
    const AUTO_INTERVAL_MS = 7000;

    const $ = (id) => document.getElementById(id);
    const root = document.documentElement;
    const stage = $('stage');
    const phone = $('phone');
    const screen = $('screen');
    const counter = $('counter');
    const progress = $('progress');
    const autoplayTrack = $('autoplayTrack');
    const autoplayBtn = $('autoplay');
    const themeBtn = $('themeToggle');
    const moduleLabel = $('moduleLabel');
    const headlineEl = $('headline');
    const unitEl = $('unit');
    const subheadEl = $('subhead');
    const titleEl = $('title');
    const descriptionEl = $('description');
    const actionEl = $('action');
    const metaEl = $('meta');
    const modulesEl = $('modules');
    const prevBtn = $('prevBtn');
    const nextBtn = $('nextBtn');

    /* ------------- RENDER ------------- */
    function setTheme(t) {
      root.setAttribute('data-theme', t);
      localStorage.setItem('eu-stats-theme', t);
    }
    function initTheme() {
      const stored = localStorage.getItem('eu-stats-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(stored || (prefersDark ? 'dark' : 'light'));
    }

    function render() {
      const s = SLIDES[idx];
      const m = MOD[s.mod];
      root.style.setProperty('--mod-accent', m.accent);
      moduleLabel.textContent = m.name;
      headlineEl.textContent = s.headline;
      unitEl.textContent = s.unit || '';
      subheadEl.textContent = s.subhead;
      titleEl.textContent = s.title;
      descriptionEl.textContent = s.description;
      actionEl.firstChild ? actionEl.replaceChildren(document.createTextNode(s.action)) : actionEl.textContent = s.action;
      // meta pills
      metaEl.innerHTML = '';
      const pills = [
        ...(s.year ? [`year: ${s.year}`] : []),
        ...(s.country ? [`geo: ${s.country}`] : []),
        ...m.datasets.map(d => d),
      ];
      pills.forEach((p, i) => {
        const el = document.createElement('span');
        el.className = 'meta-pill' + (i < 2 ? ' accent' : '');
        el.textContent = p;
        metaEl.appendChild(el);
      });
      // image swap with brief fade
      phone.classList.add('fade-out');
      setTimeout(() => {
        screen.src = `../screenshots/v2/${s.img}`;
        screen.alt = `${m.name} — ${s.title}`;
        phone.classList.remove('fade-out');
        phone.classList.add('fade-in');
        setTimeout(() => phone.classList.remove('fade-in'), 350);
      }, 100);
      // counter + progress
      counter.textContent = `${idx + 1} / ${SLIDES.length}`;
      const pct = ((idx + 1) / SLIDES.length) * 100;
      progress.style.width = pct + '%';
      // module dots
      Array.from(modulesEl.children).forEach(dot => {
        dot.classList.toggle('current', dot.dataset.mod === s.mod);
      });
      // nav buttons disabled state
      prevBtn.disabled = (idx === 0);
      nextBtn.disabled = (idx === SLIDES.length - 1);
      // preload next image
      if (SLIDES[idx + 1]) {
        const pre = new Image();
        pre.src = `../screenshots/v2/${SLIDES[idx + 1].img}`;
      }
    }

    function go(n) {
      idx = Math.max(0, Math.min(SLIDES.length - 1, n));
      render();
      if (auto) {
        clearTimeout(autoTimer);
        autoStart = performance.now();
        scheduleAuto();
      }
    }

    function next() { go(idx + 1 < SLIDES.length ? idx + 1 : idx); }
    function prev() { go(idx - 1 >= 0 ? idx - 1 : idx); }

    function jumpToModule(modKey) {
      const i = SLIDES.findIndex(s => s.mod === modKey);
      if (i >= 0) go(i);
    }

    function buildModuleDots() {
      modulesEl.innerHTML = '';
      Object.entries(MOD).forEach(([key, m], i) => {
        const b = document.createElement('button');
        b.className = 'mod-dot';
        b.dataset.mod = key;
        b.title = `${m.name} (key ${i + 1})`;
        b.textContent = m.name[0];
        b.style.setProperty('--mod-accent', m.accent);
        b.addEventListener('click', () => jumpToModule(key));
        modulesEl.appendChild(b);
      });
    }

    /* ------------- AUTOPLAY ------------- */
    function toggleAutoplay() {
      auto = !auto;
      autoplayBtn.classList.toggle('active', auto);
      autoplayBtn.querySelector('.icon-play').style.display = auto ? 'none' : '';
      autoplayBtn.querySelector('.icon-pause').style.display = auto ? '' : 'none';
      autoplayTrack.classList.toggle('on', auto);
      if (auto) {
        autoStart = performance.now();
        scheduleAuto();
        animateAutoplayBar();
      } else {
        clearTimeout(autoTimer);
        autoplayTrack.style.width = '0';
      }
    }
    function scheduleAuto() {
      clearTimeout(autoTimer);
      autoTimer = setTimeout(() => {
        if (idx >= SLIDES.length - 1) { toggleAutoplay(); return; }
        next();
      }, AUTO_INTERVAL_MS);
    }
    function animateAutoplayBar() {
      if (!auto) { autoplayTrack.style.width = '0'; return; }
      const elapsed = performance.now() - autoStart;
      const pct = Math.min(100, (elapsed / AUTO_INTERVAL_MS) * 100);
      autoplayTrack.style.width = pct + '%';
      if (pct < 100) requestAnimationFrame(animateAutoplayBar);
    }

    /* ------------- INPUT ------------- */
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      switch (e.key) {
        case 'ArrowRight': case 'PageDown': case 'j': next(); break;
        case 'ArrowLeft':  case 'PageUp':   case 'k': prev(); break;
        case ' ':          e.preventDefault(); toggleAutoplay(); break;
        case 't': case 'T': setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); break;
        case 'Home': go(0); break;
        case 'End':  go(SLIDES.length - 1); break;
        case '1': jumpToModule('population'); break;
        case '2': jumpToModule('economy'); break;
        case '3': jumpToModule('environment'); break;
        case '4': jumpToModule('trade'); break;
        case '5': jumpToModule('transport'); break;
        case '6': jumpToModule('tourism'); break;
        case '7': jumpToModule('social'); break;
        case '8': jumpToModule('science'); break;
      }
    });
    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);
    autoplayBtn.addEventListener('click', toggleAutoplay);
    themeBtn.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

    // Click anywhere on the phone advances
    phone.addEventListener('click', next);

    /* ------------- INIT ------------- */
    initTheme();
    buildModuleDots();
    render();
  </script>
